
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inevitability</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4F1EA; /* Aged paper */
            color: #2D2D2D;
            overflow: hidden;
        }
        .font-serif {
            font-family: 'Instrument Serif', serif;
        }
        .font-hand {
            font-family: 'Nanum Pen Script', cursive;
        }
        .sketch-border {
            border: 2px solid #2D2D2D;
            border-radius: 2px 8px 2px 8px / 8px 2px 8px 2px;
        }
        .grain {
            position: fixed;
            top: 0; left: 0; height: 100%; width: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.15;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
        }
        @keyframes punch {
            0% { transform: scale(1); }
            50% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }
        .punch-anim { animation: punch 0.1s ease-out; }
        
        .pulse-leader {
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            animation: glow 2s infinite alternate;
        }
        @keyframes glow {
            from { opacity: 0.8; }
            to { opacity: 1; transform: scale(1.02); }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <div class="grain"></div>
</body>
</html>
